services:
  questdb:
    image: questdb/questdb:latest
    ports:
      - "8812:8812"   # PostgreSQL wire (API Gateway queries)
      - "9009:9009"   # ILP (Collector writes)
      - "9000:9000"   # QuestDB Web Console
    volumes:
      - questdb-data:/root/.questdb
    healthcheck:
      # bash built-in TCP redirect — no curl/wget needed in the JRE image.
      # Port 9000 (HTTP console) opens only after QuestDB is fully initialised.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  mq:
    build:
      context: ../..
      dockerfile: deploy/docker/mq.Dockerfile
    environment:
      MQ_LISTEN_ADDR: ":7000"
      MQ_WAL_DIR: "./wal"
      MQ_SNAPSHOT_INTERVAL: "30s"
      MQ_INFLIGHT_TIMEOUT: "5s"
      MQ_MAX_RETRIES: "3"
      MQ_BUFFER_CAP: "1000"
    ports:
      - "7000:7000"
    healthcheck:
      # nc is available in busybox/alpine; exits 0 when TCP port is open
      test: ["CMD-SHELL", "nc -z localhost 7000"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    # Scale with: docker compose up --scale collector=3 --scale streamer=2

  streamer:
    build:
      context: ../..
      dockerfile: deploy/docker/streamer.Dockerfile
    environment:
      STREAMER_MQ_ADDR: "mq:7000"
      STREAMER_CSV_PATH: "/data/input_dcgm_metrics_20250718_134233.csv"
      STREAMER_SEND_RATE: "0"
    depends_on:
      mq:
        condition: service_healthy

  collector:
    build:
      context: ../..
      dockerfile: deploy/docker/collector.Dockerfile
    environment:
      COLLECTOR_MQ_ADDR: "mq:7000"
      COLLECTOR_QUESTDB_ILP_ADDR: "questdb:9009"
      COLLECTOR_QUESTDB_PG_ADDR: "questdb:8812"
      COLLECTOR_WORKERS: "4"
    depends_on:
      mq:
        condition: service_healthy
      questdb:
        condition: service_healthy
    deploy:
      replicas: 1

  api-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/api-gateway.Dockerfile
    environment:
      GATEWAY_QUESTDB_PG_ADDR: "questdb:8812"
      GATEWAY_LISTEN_ADDR: ":8081"
    ports:
      - "8081:8081"
    depends_on:
      questdb:
        condition: service_healthy

volumes:
  questdb-data:
