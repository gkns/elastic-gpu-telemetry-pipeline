{{- if not .Values.streamer.csv.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "elastic-gpu-telemetry.fullname" . }}-streamer-csv
  labels:
    {{- include "elastic-gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: streamer
  annotations:
    helm.sh/note: >
      Populate this PVC with your CSV file before starting the Streamer.
      Example: kubectl cp data/input_dcgm_metrics_20250718_134233.csv
      <streamer-pod>:/data/input_dcgm_metrics_20250718_134233.csv
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.streamer.csv.storageSize }}
  {{- with .Values.streamer.csv.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
