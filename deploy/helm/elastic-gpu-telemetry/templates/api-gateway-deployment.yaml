apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elastic-gpu-telemetry.fullname" . }}-api-gateway
  labels:
    {{- include "elastic-gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      {{- include "elastic-gpu-telemetry.selectorLabels" (dict "component" "api-gateway" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elastic-gpu-telemetry.selectorLabels" (dict "component" "api-gateway" "context" .) | nindent 8 }}
    spec:
      {{- include "elastic-gpu-telemetry.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api-gateway
          image: {{ .Values.apiGateway.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_QUESTDB_PG_ADDR
              value: {{ printf "%s-questdb:8812" (include "elastic-gpu-telemetry.fullname" .) | quote }}
            - name: GATEWAY_LISTEN_ADDR
              value: {{ .Values.apiGateway.config.listenAddr | quote }}
            - name: GATEWAY_PAGE_SIZE_MAX
              value: {{ .Values.apiGateway.config.pageSizeMax | quote }}
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
