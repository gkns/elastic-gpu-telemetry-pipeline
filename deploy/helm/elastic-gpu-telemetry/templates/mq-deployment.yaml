apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elastic-gpu-telemetry.fullname" . }}-mq
  labels:
    {{- include "elastic-gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: mq
spec:
  # MQ is intentionally single-replica: the WAL is local and sticky routing
  # is per-streamer. Horizontal MQ scaling requires a shared WAL backend.
  replicas: {{ .Values.mq.replicas }}
  selector:
    matchLabels:
      {{- include "elastic-gpu-telemetry.selectorLabels" (dict "component" "mq" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elastic-gpu-telemetry.selectorLabels" (dict "component" "mq" "context" .) | nindent 8 }}
    spec:
      {{- include "elastic-gpu-telemetry.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mq
          image: {{ .Values.mq.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: tcp
              containerPort: 7000
              protocol: TCP
          env:
            - name: MQ_LISTEN_ADDR
              value: {{ .Values.mq.config.listenAddr | quote }}
            - name: MQ_WAL_DIR
              value: {{ .Values.mq.config.walDir | quote }}
            - name: MQ_SNAPSHOT_INTERVAL
              value: {{ .Values.mq.config.snapshotInterval | quote }}
            - name: MQ_INFLIGHT_TIMEOUT
              value: {{ .Values.mq.config.inflightTimeout | quote }}
            - name: MQ_MAX_RETRIES
              value: {{ .Values.mq.config.maxRetries | quote }}
            - name: MQ_BUFFER_CAP
              value: {{ .Values.mq.config.bufferCap | quote }}
          volumeMounts:
            - name: wal
              mountPath: /data/wal
          resources:
            {{- toYaml .Values.mq.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: wal
          persistentVolumeClaim:
            claimName: {{ include "elastic-gpu-telemetry.fullname" . }}-mq-wal
