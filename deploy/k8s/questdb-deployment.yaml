apiVersion: apps/v1
kind: Deployment
metadata:
  name: questdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: questdb
  template:
    metadata:
      labels:
        app: questdb
    spec:
      containers:
        - name: questdb
          image: questdb/questdb:latest
          ports:
            - name: pg
              containerPort: 8812
              protocol: TCP
            - name: ilp
              containerPort: 9009
              protocol: TCP
            - name: http
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: questdb-data
              mountPath: /root/.questdb
      volumes:
        - name: questdb-data
          persistentVolumeClaim:
            claimName: questdb-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: questdb-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: questdb
spec:
  selector:
    app: questdb
  ports:
    - name: pg
      port: 8812
      targetPort: 8812
    - name: ilp
      port: 9009
      targetPort: 9009
    - name: http
      port: 9000
      targetPort: 9000
