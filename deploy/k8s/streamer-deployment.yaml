apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamer
  template:
    metadata:
      labels:
        app: streamer
    spec:
      initContainers:
        - name: wait-for-mq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mq 7000; do echo "waiting for mq"; sleep 2; done']
      containers:
        - name: streamer
          image: elastic-gpu-telemetry/streamer:latest
          imagePullPolicy: Never
          env:
            - name: STREAMER_MQ_ADDR
              value: "mq:7000"
            - name: STREAMER_CSV_PATH
              value: "/data/input_dcgm_metrics_20250718_134233.csv"
            - name: STREAMER_SEND_RATE
              value: "0"
            - name: STREAMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
