kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Forward host port 30081 → NodePort 30081 so the API Gateway is
    # reachable at http://localhost:30081 from the macOS host.
    # KIND nodes are Docker containers; their internal IPs are not
    # accessible from the host without these mappings.
    extraPortMappings:
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
  - role: worker
  - role: worker
