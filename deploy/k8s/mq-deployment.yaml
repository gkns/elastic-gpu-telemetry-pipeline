apiVersion: apps/v1
kind: Deployment
metadata:
  name: mq
spec:
  # Single replica: WAL is local and sticky FNV-1a routing is per-streamer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mq
  template:
    metadata:
      labels:
        app: mq
    spec:
      containers:
        - name: mq
          image: elastic-gpu-telemetry/mq:latest
          imagePullPolicy: Never
          ports:
            - name: tcp
              containerPort: 7000
              protocol: TCP
          env:
            - name: MQ_LISTEN_ADDR
              value: ":7000"
            - name: MQ_WAL_DIR
              value: "/data/wal"
            - name: MQ_SNAPSHOT_INTERVAL
              value: "30s"
            - name: MQ_INFLIGHT_TIMEOUT
              value: "5s"
            - name: MQ_MAX_RETRIES
              value: "3"
            - name: MQ_BUFFER_CAP
              value: "1000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: wal-data
              mountPath: /data/wal
      volumes:
        - name: wal-data
          persistentVolumeClaim:
            claimName: mq-wal-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mq-wal-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mq
spec:
  selector:
    app: mq
  ports:
    - name: tcp
      port: 7000
      targetPort: 7000
