apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-questdb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z questdb 9000; do echo "waiting for questdb"; sleep 2; done']
      containers:
        - name: api-gateway
          image: elastic-gpu-telemetry/api-gateway:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: GATEWAY_QUESTDB_PG_ADDR
              value: "questdb:8812"
            - name: GATEWAY_LISTEN_ADDR
              value: ":8081"
            - name: GATEWAY_PAGE_SIZE_MAX
              value: "1000"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
